<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedDocs</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 30% 30%, rgba(98, 62, 255, 0.18), transparent 35%),
                radial-gradient(circle at 70% 70%, rgba(0, 123, 255, 0.14), transparent 35%),
                #0b0b12;
            color: white;
            min-height: 100vh;
        }

        /* =========================
           LOBBY
        ========================= */

        #lobby {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 30px 100px;
        }

        .lobby-box {
            text-align: center;
            width: 100%;
            max-width: 900px;
        }

        .logo {
            font-size: 64px;
            margin: 0;
            letter-spacing: -2px;
        }

        .logo span {
            color: #7b5cff;
        }

        .subtitle {
            color: #9b9baa;
            font-size: 18px;
            margin-top: 10px;
            margin-bottom: 50px;
        }

        .documents {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .document-card {
            width: 220px;
            height: 150px;

            border: 1px solid #2c2c3b;
            background: rgba(26, 26, 38, 0.9);

            border-radius: 18px;
            cursor: pointer;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .document-card:hover {
            transform: scale(1.06);

            background: #222036;

            border-color: #7b5cff;

            box-shadow:
                0 0 30px rgba(123, 92, 255, 0.25);
        }

        .document-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .document-title {
            font-size: 19px;
            font-weight: bold;
        }

        .document-description {
            font-size: 13px;
            color: #9999aa;
            margin-top: 6px;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            position: absolute;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            width: 90%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 18px;

            color: #77778a;

            font-size: 13px;
        }

        .footer strong {
            color: #b0b0c0;
        }

        .discord-button {
            text-decoration: none;

            color: white;

            background: #5865F2;

            padding: 9px 15px;

            border-radius: 8px;

            font-size: 13px;
            font-weight: bold;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .discord-button:hover {
            transform: scale(1.06);

            background: #6875ff;

            box-shadow:
                0 0 22px rgba(88, 101, 242, 0.4);
        }


        /* =========================
           RECEPTA
        ========================= */

        #receptaPage {
            display: none;

            min-height: 100vh;

            padding: 40px 20px;
        }

        .topbar {
            max-width: 700px;

            margin:
                0 auto 20px auto;
        }

        .back-button {
            background: #1a1a26;

            border:
                1px solid #353547;

            color: white;

            padding:
                10px 16px;

            border-radius: 9px;

            cursor: pointer;

            transition: 0.2s;
        }

        .back-button:hover {
            transform: scale(1.04);

            background: #252538;

            border-color: #7b5cff;
        }


        .form-container {
            max-width: 700px;

            margin: auto;

            background: #171721;

            border:
                1px solid #292938;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.25);
        }

        .form-container h1 {
            margin-top: 0;
        }

        .rp-warning {
            background: #292032;

            border:
                1px solid #564267;

            padding: 12px;

            border-radius: 9px;

            font-weight: bold;

            margin-bottom: 25px;
        }

        h3 {
            margin-top: 35px;

            border-bottom:
                1px solid #333344;

            padding-bottom: 8px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-top: 18px;

            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 12px;

            background: #0f0f16;

            color: white;

            border:
                1px solid #353545;

            border-radius: 8px;

            outline: none;

            transition: 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #7b5cff;

            box-shadow:
                0 0 0 3px
                rgba(123, 92, 255, 0.12);
        }

        textarea {
            resize: vertical;
        }

        .generate-button {
            margin-top: 30px;

            width: 100%;

            padding: 14px;

            background: #6d4cff;

            color: white;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .generate-button:hover {
            transform: scale(1.02);

            background: #7c60ff;

            box-shadow:
                0 0 25px
                rgba(109, 76, 255, 0.28);
        }


        /* =========================
           TELEFON
        ========================= */

        @media (max-width: 600px) {

            .logo {
                font-size: 48px;
            }

            .documents {
                flex-direction: column;
                align-items: center;
            }

            .document-card {
                width: 100%;
                max-width: 320px;
            }

            .footer {
                flex-direction: column;

                gap: 10px;

                text-align: center;
            }

        }
    </style>
</head>


<body>


<!-- =========================
     LOBBY
========================= -->

<div id="lobby">

    <div class="lobby-box">

        <h1 class="logo">
            Med<span>Docs</span>
        </h1>

        <p class="subtitle">
            Medical Documents for RP
        </p>


        <div class="documents">

            <div
                class="document-card"
                onclick="otworzRecepte()"
            >

                <div class="document-icon">
                    💊
                </div>

                <div class="document-title">
                    Recepta
                </div>

                <div class="document-description">
                    Utwórz fikcyjną receptę RP
                </div>

            </div>

        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <span>
            Stworzone przez
            <strong>
                Kompendium Medyczne „Medycyna”
            </strong>
        </span>

        <a
            href="TU_WKLEJ_LINK_DO_DISCORDA"
            target="_blank"
            class="discord-button"
        >
            Dołącz do Discorda
        </a>

    </div>

</div>



<!-- =========================
     RECEPTA
========================= -->

<div id="receptaPage">


    <div class="topbar">

        <button
            class="back-button"
            onclick="wrocDoLobby()"
        >
            ← Powrót
        </button>

    </div>


    <div class="form-container">

        <h1>
            Recepta
        </h1>


        <div class="rp-warning">
            DOKUMENT FIKCYJNY — ROLEPLAY
        </div>


        <!-- PACJENT -->

        <h3>
            Dane pacjenta
        </h3>


        <label>
            Imię
        </label>

        <input
            type="text"
            id="imie"
        >


        <label>
            Nazwisko
        </label>

        <input
            type="text"
            id="nazwisko"
        >


        <label>
            PESEL
        </label>

        <input
            type="text"
            id="pesel"
            maxlength="11"
            inputmode="numeric"
            placeholder="Fikcyjne dane do RP"
        >


        <label>
            Data urodzenia
        </label>

        <input
            type="date"
            id="dataUrodzenia"
        >


        <label>
            Adres
        </label>

        <input
            type="text"
            id="adres"
        >



        <!-- LEK -->

        <h3>
            Przepisany produkt
        </h3>


        <label>
            Nazwa
        </label>

        <input
            type="text"
            id="lek"
        >


        <label>
            Postać
        </label>

        <select id="postac">

            <option>
                Tabletki
            </option>

            <option>
                Kapsułki
            </option>

            <option>
                Syrop
            </option>

            <option>
                Krople
            </option>

            <option>
                Maść
            </option>

            <option>
                Żel
            </option>

            <option>
                Roztwór
            </option>

            <option>
                Inna
            </option>

        </select>


        <label>
            Ilość / liczba opakowań
        </label>

        <input
            type="text"
            id="ilosc"
        >


        <label>
            Dawkowanie / sposób stosowania
        </label>

        <textarea
            id="dawkowanie"
            rows="4"
        ></textarea>


        <label>
            Dodatkowe zalecenia
        </label>

        <textarea
            id="zalecenia"
            rows="3"
        ></textarea>


        <label>
            Odpłatność
        </label>

        <select id="odplatnosc">

            <option>
                100%
            </option>

            <option>
                50%
            </option>

            <option>
                30%
            </option>

            <option>
                Bezpłatnie
            </option>

        </select>



        <!-- WYSTAWIENIE -->

        <h3>
            Informacje o wystawieniu
        </h3>


        <label>
            Data wystawienia
        </label>

        <input
            type="date"
            id="dataWystawienia"
        >


        <label>
            Realizacja od
        </label>

        <input
            type="date"
            id="realizacjaOd"
        >



        <!-- LEKARZ -->

        <h3>
            Osoba wystawiająca
        </h3>


        <label>
            Imię i nazwisko
        </label>

        <input
            type="text"
            id="lekarz"
        >


        <label>
            Specjalizacja
        </label>

        <input
            type="text"
            id="specjalizacja"
        >


        <label>
            Numer identyfikacyjny
        </label>

        <input
            type="text"
            id="numerLekarza"
        >


        <label>
            Placówka
        </label>

        <input
            type="text"
            id="placowka"
        >


        <label>
            Adres placówki
        </label>

        <input
            type="text"
            id="adresPlacowki"
        >



        <button
            class="generate-button"
            onclick="pobierzPDF()"
        >
            Generuj / Pobierz PDF
        </button>


    </div>

</div>



<script>


    /* =========================
       NAWIGACJA
    ========================= */


    function otworzRecepte() {

        document
            .getElementById("lobby")
            .style.display = "none";


        document
            .getElementById("receptaPage")
            .style.display = "block";


        window.scrollTo(0, 0);
    }



    function wrocDoLobby() {

        document
            .getElementById("receptaPage")
            .style.display = "none";


        document
            .getElementById("lobby")
            .style.display = "flex";


        window.scrollTo(0, 0);
    }



    /* =========================
       GENEROWANIE RECEPTY
    ========================= */


    function pobierzPDF() {


        const imie =
            document
                .getElementById("imie")
                .value;


        const nazwisko =
            document
                .getElementById("nazwisko")
                .value;


        const pesel =
            document
                .getElementById("pesel")
                .value;


        const dataUrodzenia =
            document
                .getElementById("dataUrodzenia")
                .value;


        const adres =
            document
                .getElementById("adres")
                .value;


        const lek =
            document
                .getElementById("lek")
                .value;


        const postac =
            document
                .getElementById("postac")
                .value;


        const ilosc =
            document
                .getElementById("ilosc")
                .value;


        const dawkowanie =
            document
                .getElementById("dawkowanie")
                .value;


        const zalecenia =
            document
                .getElementById("zalecenia")
                .value;


        const odplatnosc =
            document
                .getElementById("odplatnosc")
                .value;


        const dataWystawienia =
            document
                .getElementById("dataWystawienia")
                .value;


        const realizacjaOd =
            document
                .getElementById("realizacjaOd")
                .value;


        const lekarz =
            document
                .getElementById("lekarz")
                .value;


        const specjalizacja =
            document
                .getElementById("specjalizacja")
                .value;


        const numerLekarza =
            document
                .getElementById("numerLekarza")
                .value;


        const placowka =
            document
                .getElementById("placowka")
                .value;


        const adresPlacowki =
            document
                .getElementById("adresPlacowki")
                .value;



        const noweOkno =
            window.open("", "_blank");



        noweOkno.document.write(`

</head>

    <h1>

    </h1>


    <div class="warning">

    </div>



    <div class="sekcja">


        <h2>
            Dane pacjenta
        </h2>


        <p>


            <strong>

            </strong>

            ${imie} ${nazwisko}


            <br>


            <strong>
                PESEL:
            </strong>

            ${pesel}


            <br>


            <strong>

            </strong>

            <br>


            <strong>

            </strong>

        </p>


    </div>



    <div class="sekcja">


        <h2>
            Przepisany produkt
        </h2>


        <p>


            <strong>
                Nazwa:
            </strong>

            ${lek}


            <br>


            <strong>
                Postać:
            </strong>

            ${postac}


            <br>


            <strong>
                Ilość:
            </strong>

            ${ilosc}


            <br>


            <strong>
                Dawkowanie:
            </strong>

            ${dawkowanie}


            <br>


            <strong>
                Zalecenia:
            </strong>

            ${zalecenia}


            <br>


            <strong>
                Odpłatność:
            </strong>

            ${odplatnosc}


        </p>


    </div>



    <div class="sekcja">


        <h2>
            Informacje o wystawieniu
        </h2>


        <p>


            <strong>
                Data wystawienia:
            </strong>

            ${dataWystawienia}


            <br>


            <strong>
                Realizacja od:
            </strong>

            ${realizacjaOd}


        </p>


    </div>



    <div class="sekcja">


        <h2>
            Osoba wystawiająca
        </h2>


        <p>


            <strong>
                ${lekarz}
            </strong>

            ${specjalizacja}

            <br>


            ${adresPlacowki}


        </p>


    </div>



    <div class="stopka">


        MedDocs —
        DOKUMENT FIKCYJNY — ROLEPLAY.


        <br>


        Dokument nie jest prawdziwą receptą

    </div>



    <button
        class="drukuj"
        onclick="window.print()"

    </button>


</div>


</body>

        `);



        noweOkno.document.close();

    }


</script>


</body>
</html>
